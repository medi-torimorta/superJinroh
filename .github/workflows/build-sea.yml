name: build-sea

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: SEA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Generate Prisma client
        run: npm --workspace server run prisma:generate

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool"
          curl -L "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o "$APPIMAGETOOL"
          chmod +x "$APPIMAGETOOL"
          echo "APPIMAGETOOL=$APPIMAGETOOL" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build SEA artifact
        run: npm run sea:build

      - name: Require SignPath secrets for tag release (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNPATH_API_TOKEN"
          test -n "$SIGNPATH_ORGANIZATION_ID"
          test -n "$SIGNPATH_PROJECT_SLUG"
          test -n "$SIGNPATH_SIGNING_POLICY_SLUG"

      - name: Upload unsigned Windows exe for SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload_unsigned_windows_exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/sea/win32-x64/superjinroh.exe
          if-no-files-found: error

      - name: Sign Windows exe with SignPath
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_windows_exe.outputs.artifact-id }}
          output-artifact-directory: dist/sea/win32-x64/signed
          wait-for-completion: true

      - name: Replace unsigned exe with signed exe
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signedExe = Get-ChildItem -Path dist/sea/win32-x64/signed -Filter superjinroh.exe -Recurse | Select-Object -First 1
          if (-not $signedExe) {
            throw "Signed superjinroh.exe was not found in dist/sea/win32-x64/signed"
          }
          Move-Item -Path $signedExe.FullName -Destination dist/sea/win32-x64/superjinroh.exe -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sea-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/sea/**/superjinroh.exe
            dist/sea/**/superjinroh.dmg
            dist/sea/**/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sea-*
          merge-multiple: true
          path: release-assets

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -name 'superjinroh.exe' | head -n 1)"
          test -n "$(find release-assets -type f -name 'superjinroh.dmg' | head -n 1)"
          test -n "$(find release-assets -type f -name '*.AppImage' | head -n 1)"

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/superjinroh.exe
            release-assets/**/superjinroh.dmg
            release-assets/**/*.AppImage
          fail_on_unmatched_files: true
