name: build-sea

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: SEA (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Generate Prisma client
        run: npm --workspace server run prisma:generate

      - name: Build SEA artifact
        run: npm run sea:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sea-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/sea/**/*.zip
            dist/sea/**/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sea-*
          merge-multiple: true
          path: release-assets

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release-assets -type f -name 'superjinroh-win32-*.zip' | head -n 1)"
          test -n "$(find release-assets -type f -name 'superjinroh-darwin-*.zip' | head -n 1)"
          test -n "$(find release-assets -type f -name 'superjinroh-linux-*.tar.gz' | head -n 1)"

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/superjinroh-win32-*.zip
            release-assets/**/superjinroh-darwin-*.zip
            release-assets/**/superjinroh-linux-*.tar.gz
          fail_on_unmatched_files: true